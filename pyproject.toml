[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-agent-self-evolution"
version = "0.2.0"
description = "DSPy + GEPA Skill optimization with real remote Hermes execution and automatic artifact evaluation"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Nous Research", email = "team@nousresearch.com"},
]
keywords = ["llm", "optimization", "evolution", "dspy", "gepa", "hermes", "agent"]

dependencies = [
    "dspy==3.2.1",
    "gepa==0.0.27",
    "openai>=1.0.0",
    "pyyaml>=6.0",
    "click>=8.0",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
]
browser = ["playwright==1.64.1"]
darwinian = [
    "darwinian-evolver",
]

[project.urls]
Homepage = "https://github.com/xiaoyangmai/hermes-agent-self-evolution"
Repository = "https://github.com/xiaoyangmai/hermes-agent-self-evolution"
Upstream = "https://github.com/NousResearch/hermes-agent-self-evolution"

[project.scripts]
hermes-evolve = "evolution.dspy_loop:main"

[tool.setuptools.packages.find]
include = ["evolution*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
